name: Release

# A release is release-please's: merging its release pull request tags vX.Y.Z
# and calls this workflow (release-please.yml). blairham/.github's
# go-release.yml builds and publishes it: the tests, GoReleaser
# (.goreleaser.yaml: binaries for every platform, notarized darwin builds, the
# Homebrew formula), a cosign-signed checksums.txt and SLSA build provenance.
# The signing identity is go-release.yml itself; SECURITY.md shows how to
# verify it. The notes are the tag's section of CHANGELOG.md, which
# release-please wrote.
#
# Pushing a tag by hand releases nothing: there is one path to a release. That
# also keeps the moving major alias (v4), which the alias job below pushes,
# from ever starting a release of its own.
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to release (e.g. v4.7.3). Must already exist."
        required: true
        type: string
  # Re-run a release for a tag that already exists — after a failed publish,
  # say — without moving or re-creating the tag; or dry-run the build.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v4.7.3). Must already exist. Leave empty for a dry run."
        required: false
        type: string
      dry-run:
        description: "Build with GoReleaser --snapshot; publish, sign and attest nothing."
        required: false
        type: boolean
        default: false

# Read-only by default; each job asks for exactly what it writes.
permissions:
  contents: read

jobs:
  # The version is release-please's answer, not a number someone typed: the
  # tag must be the version its manifest records at that tag, so a release can
  # only be the bump its commits call for, or the Release-As a maintainer
  # gave it (CONTRIBUTING.md). A dry run builds whatever it is given and
  # skips this.
  version:
    name: Version is release-please's
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.dry-run != true
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: The tag is the version release-please recorded
        if: inputs.dry-run != true
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          want="v$(jq -r '."."' .release-please-manifest.json)"
          if [ "$TAG" != "$want" ]; then
            echo "::error::the tag is $TAG but .release-please-manifest.json at it records $want; release by merging release-please's pull request"
            exit 1
          fi

  release:
    name: Release
    needs: version
    permissions:
      contents: write # the GitHub release and its assets
      # Keyless cosign and the provenance attestation both sign with the
      # workflow's OIDC identity.
      id-token: write
      attestations: write # store the provenance in the repository's attestations
    uses: blairham/.github/.github/workflows/go-release.yml@ed30c1599f3dae98165801429893d397069b433c # v0.0.4
    with:
      tag: ${{ inputs.tag }}
      snapshot: ${{ inputs.dry-run == true }}
      # blairham/goreleaser, for homebrew_bottles (goreleaser/goreleaser#7342).
      goreleaser-ref: 6b2bad9d43ac7c6469cd2607a8b79bbbcbbc4b80
      test-command: make test
    secrets:
      # A PAT with contents:write on blairham/homebrew-tap, so the formula can
      # be committed to that separate repo.
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # Apple Developer ID signing + notarization of the darwin binaries. The
      # notarize block in .goreleaser.yaml self-disables when MACOS_SIGN_P12
      # is unset.
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

  # `uses: blairham/go-pre-commit@v4` is the documented way to consume the
  # composite action, and a documented path that does not resolve is worse
  # than no documentation. Move the alias with every release rather than
  # remembering to do it by hand — and only after the release is published.
  alias:
    name: Move the major-version alias tag
    needs: release
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the alias tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Move the alias
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          major="${TAG%%.*}"          # v4.6.7 -> v4
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$major" "$TAG^{}" --force
          # Retire the old alias, then publish the new one. Deleting first keeps
          # this a plain create rather than a rewrite of a ref someone may be
          # resolving right now.
          git push origin ":refs/tags/$major" || true
          git push origin "refs/tags/$major"
