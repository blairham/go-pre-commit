name: Release

on:
  push:
    tags:
    # Full versions only. The moving major alias (v4) is a tag too, and matching
    # "v*" would make every alias update kick off a second, duplicate release.
    - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0). Must already exist."
        required: true
        type: string

permissions:
  contents: write

env:
  GO_VERSION: "1.26"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        check-latest: true # setup-go's manifest lags fresh Go patch releases; resolve via go.dev
        cache: false # replaced by the release-scoped cache below

    # Release-scoped Go cache: setup-go's built-in cache is exact-match on
    # go.sum and usually saved by CI test jobs (host-platform builds only);
    # this one falls back on a restore-keys prefix and is saved at job end —
    # after goreleaser — so it warms every cross-compiled GOOS/GOARCH target.
    - name: Restore release Go cache
      uses: actions/cache@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-release-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
        restore-keys: |
          go-release-${{ runner.os }}-

    - name: Checkout tag (workflow_dispatch)
      if: github.event_name == 'workflow_dispatch'
      run: git checkout "refs/tags/${{ inputs.tag }}"

    - name: Run tests
      run: make test

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v7
      with:
        distribution: goreleaser
        version: "~> v2"
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
        MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
        MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
    # `uses: blairham/go-pre-commit@v4` is the documented way to consume the
    # composite action, and a documented path that does not resolve is worse
    # than no documentation. Move the alias with every release rather than
    # remembering to do it by hand.
    - name: Move the major-version alias tag
      env:
        TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      run: |
        major="${TAG%%.*}"          # v4.6.7 -> v4
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag "$major" "$TAG^{}" --force
        # Retire the old alias, then publish the new one. Deleting first keeps
        # this a plain create rather than a rewrite of a ref someone may be
        # resolving right now.
        git push origin ":refs/tags/$major" || true
        git push origin "refs/tags/$major"
