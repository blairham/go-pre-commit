name: CI

# One workflow holds everything that gates a merge, so there is one file to
# read and one check to require. Splitting pre-commit or tests into their own
# workflow bought nothing and cost a second place to keep in sync.
on:
  pull_request:
    # `synchronize` is every push to a branch with an open pull request, which
    # is the feedback that matters. A draft is treated exactly like any other
    # pull request: the distinction bought a little runner time and cost a
    # second set of rules to hold in your head.
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    # Everything runs here too, not just pre-commit. A squash merge lands a
    # tree no pull request ever built — the branch was tested before the
    # squash, and `main` may have moved under it since — so the merge result
    # gets its own run rather than inheriting the branch's green tick.
    branches: [main]

permissions:
  contents: read

concurrency:
  # A superseded push is not worth finishing; only the newest commit matters.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs for every commit that reaches GitHub — every push to a pull request,
  # draft or not, and every push to main. It is the only job that looks at
  # *every* file rather than at Go: trailing whitespace, licence headers,
  # secrets, the toolchain pin. None of that is worth detecting changes for,
  # and a secret committed to a draft is committed.
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `--new-from-merge-base` needs the base branch's history to find the
          # common ancestor; a shallow clone has none of it.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true # go-mod-tidy-repo resolves the whole graph; uncached it is slow and flaky
      - name: Resolve the diff this change introduces
        # Everything below runs against this range and nothing else — no
        # `--all-files` anywhere in CI. A branch create or a force-push sends an
        # all-zero `before`, and an unresolvable ref makes both pre-commit and
        # golangci-lint report nothing while exiting 0, which is the silent pass
        # this whole job exists to prevent. So: fall back to the merge base with
        # main, then verify every ref actually resolves and fail loudly if not.
        id: range
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base="$BASE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable base ref ('${base:-empty}') — falling back to the merge base with main"
            base="$(git merge-base origin/main "$HEAD_SHA")"
          fi
          git rev-parse --verify "${base}^{commit}" >/dev/null
          git rev-parse --verify "${HEAD_SHA}^{commit}" >/dev/null
          # The manual hook below diffs against origin/main; if that is missing
          # it reports `0 issues` and exits 0 rather than erroring.
          git rev-parse --verify origin/main >/dev/null
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Linting ${base}..${HEAD_SHA}"
      - name: Run pre-commit hooks
        # Nothing is skipped here, unlike every other repo, which skips the
        # HEAD-relative `golangci-lint`. Building a `language: golang` hook is
        # this project's product, and the hook reporting nothing against a clean
        # checkout is beside the point — that it *builds and runs* is the thing
        # under test, and this is the one job that runs the action from the
        # checkout. The step below is what gates the change itself.
        uses: ./
        with:
          extra_args: --from-ref ${{ steps.range.outputs.base }} --to-ref ${{ steps.range.outputs.head }}
      - name: Lint what this change introduces
        # Same config, same pin, same hook — asked the narrower question, and
        # told not to fix (`--fix=false` in the hook's args): a linter that
        # repairs its own findings exits 0 and reports nothing, which is a green
        # check over unchanged, still-broken committed code.
        uses: ./
        with:
          extra_args: --from-ref ${{ steps.range.outputs.base }} --to-ref ${{ steps.range.outputs.head }} --hook-stage manual golangci-lint-new

  # Gating happens inside the jobs, never with a workflow-level `paths:`
  # filter: a required check that never runs reports as *pending forever*
  # rather than as passed, which makes a docs-only pull request unmergeable.
  # Anything unrecognised counts as code, so when this is wrong it is wrong in
  # the direction of running the tests.
  # Only after the cheap universal checks have passed is it worth asking the
  # expensive question, so this waits on pre-commit.
  changes:
    name: Detect changed files
    needs: pre-commit
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff needs the base commit, not just HEAD
      - id: filter
        name: Is any of this code?
        env:
          # On a merge to main there is no pull request; `before` is the commit
          # main pointed at, which makes the diff the merge itself.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            # A merge runs everything. Not because the merge itself changed code
            # — it may be pure prose — but because this is the first time this
            # tree is tested *as main*, and what it protects against is an
            # earlier merge that broke something nobody has run since.
            echo "push to $GITHUB_REF_NAME — running everything"
            code=true
          elif ! git cat-file -e "$BASE" 2>/dev/null; then
            # No usable base commit — a force push, or a shallow fetch that did
            # not reach it. `git diff` would fail here and print nothing, and an
            # empty diff is indistinguishable from "only prose changed", so this
            # would silently skip every test. The safe answer is to run them.
            echo "base commit $BASE is not present — running everything"
            code=true
          else
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in
                docs/*|*.md|LICENSE|LICENSE.*|*.png|*.jpg|*.gif|*.svg) ;; # prose
                *) code=true; break ;;
              esac
            done <<<"$(git diff --name-only "$BASE"...HEAD)"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "changed files are $([ "$code" = true ] && echo 'code — full run' || echo 'prose only — skipping the code jobs')"

  test:
    name: Build and test
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - run: make test
        if: needs.changes.outputs.code == 'true'


  # Parity is this project's entire claim, so a change that breaks it fails
  # before review rather than after a merge to main.
  language-integration:
    name: Parity with Python pre-commit
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          python-version: '3.13'
      - name: Install Python pre-commit
        if: needs.changes.outputs.code == 'true'
        # Pinned (with hashes, in .github/requirements/parity.in -> parity.txt) to
        # the line our version number claims parity with. The harness
        # rejects any other line, so a bump here is a deliberate parity decision.
        run: pip install --require-hashes -r .github/requirements/parity.txt
      - name: Run parity tests
        if: needs.changes.outputs.code == 'true'
        # PARITY_REQUIRE turns "no Python found" and "zero checks ran" from a
        # green skip into a failure. This job exists to make the comparison; a
        # run that makes no comparison has not done its job.
        env:
          PARITY_REQUIRE: '1'
        run: go test -v -tags=integration -timeout=600s ./test/integration/
      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parity-report
          path: test/integration/parity_report.json

  # No `if:` needed: a job that `needs` a skipped job is itself skipped.
  build:
    name: Build
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - run: make build
        if: needs.changes.outputs.code == 'true'

  # The composite action is published to the Marketplace and its README offers
  # it to Linux, macOS and Windows runners, but only Linux had ever run it: the
  # `pre-commit` job above uses `./`, and nothing else did. The macOS and
  # Windows halves of the install script -- `shasum` where there is no
  # `sha256sum`, `7z` and the `.zip` archive, the Darwin/Windows names -- were
  # shipped unexecuted. This runs them.
  #
  # Note what this measures: the action installs the *released* binary, so this
  # job tests the install path and the current release, not the code in the
  # pull request. That is the intended scope -- "does the thing we publish work
  # where we say it does".
  action:
    name: Action (${{ matrix.os }})
    needs: pre-commit
    strategy:
      # One runner's failure must not hide the other's; a Windows-only break is
      # the most likely kind here and the least likely to be noticed.
      fail-fast: false
      matrix:
        # Linux is deliberately absent: the `pre-commit` job already runs the
        # action on ubuntu-latest for every commit, so repeating it here would
        # buy a third runner and no coverage. macos-latest is arm64 and
        # windows-latest is x64, which is every published archive these runners
        # can ask for.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install through the action
        uses: ./
        with:
          # The run step is exercised separately below against a config small
          # enough to reason about. This repo's own hook set needs a Go
          # toolchain and would be testing something else.
          install-only: 'true'
          cache: 'false'

      - name: The binary is on PATH and reports its version
        shell: bash
        run: |
          set -euo pipefail
          pre-commit --version
          # A drop-in that answers to the name is the whole contract, so assert
          # the name resolves rather than trusting the step above to have failed.
          command -v pre-commit

      - name: A hook with no environment runs, and changes a file
        # pygrep needs no installed environment, so this is the part of the tool
        # that works on every platform. It is the Windows leg's real assertion.
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          git init -q .
          git config user.email ci@example.com
          git config user.name CI
          cat > .pre-commit-config.yaml <<'YAML'
          repos:
          -   repo: local
              hooks:
              -   id: no-todo
                  name: no TODO markers
                  language: pygrep
                  entry: TODO
          YAML
          printf 'clean line\n' > ok.txt
          printf 'TODO fix me\n' > bad.txt
          git add -A

          # pygrep fails when the pattern matches, so a pass means it did nothing.
          if pre-commit run --all-files --color=never; then
            echo "::error::pygrep passed on a file containing the pattern" >&2
            exit 1
          fi
          echo "pygrep hook ran and matched"

      - name: A hook that builds an environment runs, and changes a file
        # Runs on Windows too since v4.6.10 (#53). The released binary is what
        # this job installs, so a regression there shows up here even if the
        # from-source Windows job is green.
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          git init -q .
          git config user.email ci@example.com
          git config user.name CI
          cat > .pre-commit-config.yaml <<'YAML'
          repos:
          -   repo: https://github.com/pre-commit/pre-commit-hooks
              rev: v5.0.0
              hooks:
              -   id: trailing-whitespace
          YAML
          printf 'x   \n' > f.txt
          git add -A

          # The hook fixes the file, so a passing run means it did nothing.
          if pre-commit run --all-files --color=never; then
            echo "::error::trailing-whitespace passed on a file that needed fixing" >&2
            exit 1
          fi

          # Exit codes are cheap to get right by accident. The file is not.
          got="$(cat f.txt)"
          if [ "$got" != "x" ]; then
            echo "::error::whitespace was not fixed; f.txt is $(od -c f.txt | head -1)" >&2
            exit 1
          fi
          echo "hook environment built, hook ran, file fixed"

  # The `action` job above installs the *released* binary, so it cannot test a
  # fix before it ships. This builds the pull request's code on Windows and
  # runs one hook per backend that installs an environment there. Each input
  # is one the hook must reject, so a pass means the hook did nothing.
  windows-hooks:
    name: Hooks from source (windows-latest)
    needs: changes
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          python-version: '3.13'
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        if: needs.changes.outputs.code == 'true'
        with:
          ruby-version: '3.3'
      - name: Build from this checkout
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/pre-commit.exe" .
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # nodeenv is what the node backend drives, as upstream's does.
          python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/nodeenv.txt
      - name: python, node and golang hooks build an environment and run
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          pre-commit --version
          tmp="$(mktemp -d)"
          cd "$tmp"
          git init -q .
          git config user.email ci@example.com
          git config user.name CI
          cat > .pre-commit-config.yaml <<'YAML'
          repos:
          -   repo: https://github.com/pre-commit/pre-commit-hooks
              rev: v5.0.0
              hooks:
              -   id: trailing-whitespace
          -   repo: https://github.com/blairham/pre-commit-hooks
              rev: v0.4.0
              hooks:
              -   id: check-conflict-markers
          -   repo: local
              hooks:
              -   id: prettier
                  name: prettier
                  language: node
                  entry: prettier --check
                  additional_dependencies: ['prettier@3.3.3']
                  files: \.json$
          YAML
          printf 'x   \n' > f.txt
          printf '<<<<<<< ours\na\n=======\nb\n>>>>>>> theirs\n' > conflict.txt
          printf '{"a":1,\n  "b":2}\n' > ugly.json
          git add -A

          # A hook that cannot start also exits non-zero, so the exit code
          # alone cannot tell "rejected the input" from "never ran". The
          # status line can: Failed is a verdict, Error is a hook that broke.
          fails() {
            if out="$(pre-commit run "$1" --all-files --color=never 2>&1)"; then
              echo "$out"
              echo "::error::$1 passed on input it must reject" >&2
              exit 1
            fi
            echo "$out"
            if ! grep -qE '\.Failed$' <<<"$out" || grep -q '\[ERROR\]' <<<"$out"; then
              echo "::error::$1 did not run to a verdict" >&2
              exit 1
            fi
            echo "$1 ran and rejected its input"
          }
          fails trailing-whitespace
          fails check-conflict-markers
          fails prettier

          # Exit codes are cheap to get right by accident. The fixed file is not.
          if [ "$(cat f.txt)" != "x" ]; then
            echo "::error::trailing-whitespace did not fix f.txt" >&2
            exit 1
          fi

      - name: ruby and rust hooks build an environment and run
        # Each backend gets a hook repository made right here, so what is
        # exercised is this tool's install path (gem build + gem install,
        # cargo install --path) rather than somebody else's repo. Both hooks
        # reject a file containing TODO.
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkrepo() { git init -q "$1"; git -C "$1" config user.email ci@example.com; git -C "$1" config user.name CI; }

          mkrepo "$root/rubyhook"
          cd "$root/rubyhook"
          mkdir bin
          cat > no-todo.gemspec <<'RUBY'
          Gem::Specification.new do |s|
            s.name = 'no-todo'
            s.version = '0.0.0'
            s.summary = 'rejects marker files'
            s.authors = ['ci']
            s.files = ['bin/no-todo-rb']
            s.executables = ['no-todo-rb']
          end
          RUBY
          cat > bin/no-todo-rb <<'RUBY'
          #!/usr/bin/env ruby
          bad = ARGV.select { |f| File.read(f).include?('TODO') }
          bad.each { |f| puts "#{f}: TODO" }
          exit(bad.empty? ? 0 : 1)
          RUBY
          printf -- '-   id: no-todo-rb\n    name: no TODO (ruby)\n    entry: no-todo-rb\n    language: ruby\n' > .pre-commit-hooks.yaml
          git add -A && git commit -qm hook

          mkrepo "$root/rusthook"
          cd "$root/rusthook"
          mkdir src
          printf '[package]\nname = "no-todo-rs"\nversion = "0.0.0"\nedition = "2021"\n' > Cargo.toml
          cat > src/main.rs <<'RUST'
          fn main() {
              let mut bad = false;
              for f in std::env::args().skip(1) {
                  if std::fs::read_to_string(&f).unwrap_or_default().contains("TODO") {
                      println!("{f}: TODO");
                      bad = true;
                  }
              }
              std::process::exit(if bad { 1 } else { 0 });
          }
          RUST
          printf -- '-   id: no-todo-rs\n    name: no TODO (rust)\n    entry: no-todo-rs\n    language: rust\n' > .pre-commit-hooks.yaml
          git add -A && git commit -qm hook

          mkrepo "$root/target"
          cd "$root/target"
          printf 'TODO: fix\n' > bad.txt
          git add -A

          verdict() {
            if out="$(pre-commit try-repo "$(cygpath -w "$1")" "$2" --all-files --color=never 2>&1)"; then
              echo "$out"
              echo "::error::$2 passed on input it must reject" >&2
              exit 1
            fi
            echo "$out"
            if ! grep -qE '\.Failed$' <<<"$out" || grep -q '\[ERROR\]' <<<"$out" || ! grep -q 'bad.txt: TODO' <<<"$out"; then
              echo "::error::$2 did not run to a verdict" >&2
              exit 1
            fi
            echo "$2 ran and rejected its input"
          }
          verdict "$root/rubyhook" no-todo-rb
          verdict "$root/rusthook" no-todo-rs
