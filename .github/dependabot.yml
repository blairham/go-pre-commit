# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
  # Covers the workflows and the composite action.yml at the root, which is
  # what `uses: blairham/go-pre-commit@v4` runs in other people's pipelines.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
