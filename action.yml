name: go-pre-commit
# The Marketplace listing shows this verbatim and rejects one over 125
# characters. It opens with the README's first line; keep the two in step.
description: >-
  Run your existing pre-commit hooks without installing Python. A drop-in for
  pre-commit/action.
author: blairham
branding:
  icon: check-circle
  color: green

inputs:
  version:
    description: >-
      Release of go-pre-commit to install (e.g. "v4.6.6"), or "latest".
    required: false
    default: latest
  extra_args:
    description: Extra arguments passed to `pre-commit run`.
    required: false
    default: --all-files
  cache:
    description: Cache hook environments (~/.cache/pre-commit) between runs.
    required: false
    default: 'true'
  install-only:
    description: >-
      Install the binary onto PATH (and optionally cache) but skip the
      `pre-commit run` step. For workflows that drive pre-commit themselves
      (diff-scoped runs, `install-hooks` cache seeding, custom log capture).
    required: false
    default: 'false'

outputs:
  cache-key:
    description: >-
      The key hook environments are cached under: the runner's OS,
      architecture, image and Python, and the hash of .pre-commit-config.yaml.
    value: ${{ steps.cache-key.outputs.key }}

runs:
  using: composite
  steps:
    - name: Install go-pre-commit
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        case "$RUNNER_OS" in
          Linux)   os=Linux ;;
          macOS)   os=Darwin ;;
          Windows) os=Windows ;;
          *) echo "Unsupported OS: $RUNNER_OS" >&2; exit 1 ;;
        esac

        case "$RUNNER_ARCH" in
          X64)   arch=x86_64 ;;
          ARM64) arch=arm64 ;;
          X86)   arch=i386 ;;
          *) echo "Unsupported architecture: $RUNNER_ARCH" >&2; exit 1 ;;
        esac

        ext=tar.gz
        if [ "$os" = Windows ]; then ext=zip; fi
        archive="pre-commit_${os}_${arch}.${ext}"

        if [ "$VERSION" = latest ]; then
          # Resolve "latest" to one tag, once. Fetching the archive and
          # checksums.txt through two separate latest/download redirects lets
          # them come from different releases while one is being published,
          # and the checksum check then fails a correct release (#69).
          url="$(curl -fsSLI --retry 5 --retry-all-errors -o /dev/null -w '%{url_effective}' \
            https://github.com/blairham/go-pre-commit/releases/latest)"
          tag="${url##*/}"
          case "$tag" in
            v[0-9]*) ;;
            *) echo "Could not resolve the latest release (got '$url')" >&2; exit 1 ;;
          esac
        else
          case "$VERSION" in
            v*) tag="$VERSION" ;;
            *)  tag="v$VERSION" ;;
          esac
        fi
        echo "Installing go-pre-commit ${tag}"
        base="https://github.com/blairham/go-pre-commit/releases/download/${tag}"

        dir="${RUNNER_TEMP}/go-pre-commit"
        mkdir -p "$dir"
        cd "$dir"

        curl -fsSL --retry 5 --retry-all-errors -O "${base}/${archive}"
        curl -fsSL --retry 5 --retry-all-errors -O "${base}/checksums.txt"
        if command -v sha256sum >/dev/null 2>&1; then
          grep " ${archive}\$" checksums.txt | sha256sum -c -
        else
          grep " ${archive}\$" checksums.txt | shasum -a 256 -c -
        fi

        if [ "$ext" = zip ]; then
          7z x -y "$archive" >/dev/null
        else
          tar -xzf "$archive"
        fi

        echo "$dir" >> "$GITHUB_PATH"
        "$dir/pre-commit" --version

    # A hook environment is built against the runner's own interpreters and
    # libraries, so one restored onto a different image, architecture or
    # Python is broken: a virtualenv made on ubuntu-24.04 fails every import
    # on 26.04 (#194). Nothing in the old key changed when the image did, and
    # a restore that hits never saves, so the broken entry stayed. The key
    # names all of them; a hosted image's weekly update is a cold cache.
    #
    # Read in the shell, not as `${{ env.ImageOS }}`: the env context holds
    # what a workflow sets, not the runner's own environment, so the
    # expression would be empty. It runs with or without `cache` so the key is
    # an output CI can check.
    - name: Key hook environments to this runner
      id: cache-key
      shell: bash
      env:
        CONFIG_HASH: ${{ hashFiles('.pre-commit-config.yaml') }}
      run: |
        set -euo pipefail

        # Hosted runners name their image; a self-hosted one usually does not,
        # and then the Python below is what tells two machines apart.
        image="${ImageOS:-self-hosted}-${ImageVersion:-unknown}"

        # The interpreter the Python backend builds against: the first of
        # these on PATH (python first on Windows, where python3 is usually
        # the Store stub).
        names="python3 python"
        if [ "$RUNNER_OS" = Windows ]; then names="python python3"; fi
        py=nopython
        for name in $names; do
          if v="$("$name" -c 'import sys; print("%d.%d.%d" % sys.version_info[:3])' 2>/dev/null)"; then
            py="py${v}"
            break
          fi
        done

        key="go-pre-commit-${RUNNER_OS}-${RUNNER_ARCH}-${image}-${py}-${CONFIG_HASH}"
        echo "Hook environment cache key: ${key}"
        echo "key=${key}" >> "$GITHUB_OUTPUT"

    - name: Cache hook environments
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: ${{ steps.cache-key.outputs.key }}

    - name: Run pre-commit
      if: inputs.install-only != 'true'
      shell: bash
      run: pre-commit run --show-diff-on-failure --color=always ${{ inputs.extra_args }}
