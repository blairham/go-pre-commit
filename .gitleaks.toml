# gitleaks configuration for go-pre-commit: the default rules.
#
# Rendered from blairham/.github baseline/gitleaks.toml.tmpl by `make sync`.
# An allowlist entry is an override (overrides/go-pre-commit.yml) and carries the
# reason it is not a secret. Allowlist exact values, never a broad pattern: a
# wildcard silences the rule that exists to catch a genuine key.

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for false positives"

# Files to ignore completely
paths = [
    # Test files often contain fake/example credentials
    '''.*_test\.go''',
    # Build output
    '''^build/''',
    # Vendored dependencies
    '''^vendor/''',
]
