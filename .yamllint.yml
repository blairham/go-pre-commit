# yamllint configuration.
#
# Block sequences are indented under their parent key (`key:` then
# `  - item`, parent+2) — the Kubernetes/Helm convention. Editor note:
# VS Code's kubernetes-yaml-formatter v2 honors this via
# `better-yaml.indentSeq: true`; Prettier dedents sequences and offers no
# override, so keep *.yaml/*.yml out of Prettier format-on-save.
#
# Enforced via pre-commit; run manually: yamllint .
extends: default

rules:
  indentation:
    spaces: 2
    indent-sequences: true
  # Long lines are widespread (URLs, image refs, generated blocks) and not
  # worth reflowing — relax rather than fix.
  line-length: disable
  truthy:
    check-keys: false
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1
  document-start: disable
